<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PrimeVest Trade</title>

<link rel="stylesheet" href="css/trade.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>
  <body>

<!-- Overlay -->
<div id="overlay" class="overlay"></div>

<!-- Sidebar -->
<div id="sidebar" class="sidebar">

    <div class="sidebar-header">

        <button id="closeMenu" class="close-btn">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <h2>Menu</h2>

        <span>🇬🇧 EN</span>

    </div>

    <div class="profile-box">

        <div class="avatar" id="avatar">P</div>

        <div class="user-info">
            <h3 id="username">PrimeVest User</h3>
            <p id="email">user@email.com</p>
        </div>

    </div>

    <div class="menu-title">

        <div class="logo-circle">P</div>

        <span>PrimeVest</span>

    </div>

    <ul class="menu">

        <li onclick="location.href='settings.html'">
            <i class="fa-solid fa-user-gear"></i>
            <span>Account Settings</span>
            <i class="fa-solid fa-angle-right"></i>
        </li>

        <li onclick="location.href='deposit.html'">
            <i class="fa-solid fa-wallet"></i>
            <span>Deposit</span>
            <i class="fa-solid fa-angle-right"></i>
        </li>

        <li onclick="location.href='withdraw.html'">
            <i class="fa-solid fa-money-bill-transfer"></i>
            <span>Withdraw</span>
            <i class="fa-solid fa-angle-right"></i>
        </li>

        <li onclick="location.href='history.html'">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>History</span>
            <i class="fa-solid fa-angle-right"></i>
        </li>

        <li class="active">
            <i class="fa-solid fa-gift"></i>
            <span>Refer & Earn</span>
        </li>

    </ul>

    <div class="divider"></div>

    <div class="toggle-item">

        <div class="left">
            <i class="fa-solid fa-moon"></i>
            Dark Theme
        </div>

        <label class="switch">
            <input type="checkbox" checked>
            <span class="slider"></span>
        </label>

    </div>

    <ul class="menu secondary">

        <li>
            <i class="fa-regular fa-bell"></i>
            <span>Notifications</span>
        </li>

        <li>
            <i class="fa-regular fa-circle-question"></i>
            <span>Help Centre</span>
        </li>

        <li>
            <i class="fa-solid fa-shield-halved"></i>
            <span>Security</span>
        </li>

        <li>
            <i class="fa-regular fa-comments"></i>
            <span>Live Chat</span>
        </li>

        <li>
            <i class="fa-solid fa-circle-info"></i>
            <span>About PrimeVest</span>
        </li>

    </ul>

    <div class="logout">
        <i class="fa-solid fa-right-from-bracket"></i>
        Log Out
    </div>

</div>

<!-- HEADER -->

<header>

<button id="menuBtn" class="menu-btn">

<i class="fa-solid fa-bars"></i>

</button>
<div class="wallet">

<i class="fa-solid fa-wallet"></i>

<span id="balance">$0.00</span>

</div>

<div class="header-right">

<button id="depositBtn">

Deposit

</button>

<i class="fa-regular fa-bell"></i>

</div>

</header>

<!-- MARKET TABS -->

<div class="markets">

<button class="market active"
data-market="evenodd">

Even / Odd

</button>

<button class="market"
data-market="match">

Matches / Differs

</button>

<button class="market"
data-market="raise">

Raise / Fall

</button>

</div>

<!-- CHART -->

<section class="chart-area">

<div class="chart-top">

<select id="symbol">

<option>Vol 10 (1s)</option>

<option>Vol 25 (1s)</option>

<option>Vol 50 (1s)</option>

<option>Vol 75 (1s)</option>

<option>Vol 100 (1s)</option>

</select>

<div id="price">

1000.00

</div>

</div>

<canvas id="chartCanvas">

</canvas>

</section>

<!-- AUTO / MANUAL -->

<div class="mode">

<button class="modeBtn active">

AUTO

</button>

<button class="modeBtn">

MANUAL

</button>

</div>

<!-- STAKE -->

<section class="trade-box">

<label>

Stake

</label>

<div class="stake-row">

<button id="minus">

−

</button>

<input
type="number"
id="stake"
value="10"
min="1">

<button id="plus">

+

</button>

</div>

<div class="quick">

<button>1</button>

<button>5</button>

<button>10</button>

<button>25</button>

<button>50</button>

<button>100</button>

</div>

<div class="settings">

<div>

<label>

Take Profit

</label>

<input
type="number"
id="takeProfit"
value="200">

</div>

<div>

<label>

Stop Loss

</label>

<input
type="number"
id="stopLoss"
value="100">

</div>

<div>

<label>

Multiplier

</label>

<input
type="number"
id="multiplier"
value="2">

</div>

</div>

</section>

<!-- EVEN / ODD -->

<section
id="evenoddMarket"
class="marketBox">

<button
class="buy even">

EVEN

<span>

95%

</span>

</button>

<button
class="sell odd">

ODD

<span>

95%

</span>

</button>

</section>

<!-- MATCHES / DIFFERS -->

<section
id="matchMarket"
class="marketBox hidden">

<input
type="number"
id="matchDigit"
min="0"
max="9"
placeholder="Digit 0-9">

<button
class="buy">

MATCHES

</button>

<button
class="sell">

DIFFERS

</button>

</section>

<!-- RAISE / FALL -->

<section
id="raiseMarket"
class="marketBox hidden">

<button
class="buy">

RAISE

</button>

<button
class="sell">

FALL

</button>

</section>

<!-- BOTTOM NAVIGATION -->

<nav>

<a href="dashboard.html">

<i class="fa-solid fa-house"></i>

<span>

Home

</span>

</a>

<a
class="active"
href="trade.html">

<i class="fa-solid fa-chart-line"></i>

<span>

Trade

</span>

</a>

<a href="history.html">

<i class="fa-solid fa-clock"></i>

<span>

History

</span>

</a>

<a href="profile.html">

<i class="fa-solid fa-user"></i>

<span>

Profile

</span>

</a>

</nav>

<script src="js/trade.js"></script>

</body>

</html>
